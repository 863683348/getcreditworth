name: Daily Data Update

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      skip_revalidate:
        description: "Skip ISR revalidation call"
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: "20"

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate posts.tsx integrity
        run: node scripts/validate-posts.mjs
        continue-on-error: false

      - name: Check seed library health
        id: seed-check
        run: |
          SEEDS=$(node -e "const fs=require('fs'); const seeds=new Set(); fs.readdirSync('data').filter(f=>f.startsWith('seeds-')&&f.endsWith('.json')).forEach(f=>{const d=require('./data/'+f); Object.keys(d).forEach(k=>seeds.add(k))}); console.log(seeds.size)")
          THRESHOLD=300
          echo "seed_count=$SEEDS" >> $GITHUB_OUTPUT
          echo "Seed count: $SEEDS (threshold: $THRESHOLD)"
          if [ "$SEEDS" -lt "$THRESHOLD" ]; then
            echo "seed_low=true" >> $GITHUB_OUTPUT
            echo "⚠️  Seed library is LOW, will regenerate"
          else
            echo "seed_low=false" >> $GITHUB_OUTPUT
          fi

      - name: Regenerate seeds if low
        if: steps.seed-check.outputs.seed_low == 'true'
        run: node scripts/seed-healthcheck.mjs

      - name: Merge seed books
        if: steps.seed-check.outputs.seeds > 0
        run: node scripts/merge-seeds.mjs

      - name: Fetch Audible API data for PENDING books
        if: steps.seed-check.outputs.seeds > 0
        run: node scripts/fetch-audible.mjs
        timeout-minutes: 15

      - name: Commit seed files + data updates
        run: |
          git config user.name "getcreditworth-bot"
          git config user.email "bot@getcreditworth.com"
          git add data/seeds-*.json data/books.json data/books-merged.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily book data update $(date +'%Y-%m-%d')"
            git push
            echo "Changes pushed to origin"
          fi

      - name: Trigger ISR revalidation
        if: ${{ !inputs.skip_revalidate }}
        run: |
          if [ -n "${{ vars.SITE_URL }}" ]; then
            curl -s -X POST "${{ vars.SITE_URL }}/api/revalidate" \
              -H "Content-Type: application/json" \
              -d '{"secret":"${{ secrets.REVALIDATE_SECRET }}"}'
          else
            echo "SITE_URL not set, skipping revalidation"
          fi
        continue-on-error: true