name: Social Auto Post

on:
  schedule:
    - cron: '0 10 * * 1,4'
  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        required: false
        default: devto
        type: string

jobs:
  post-devto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/social/post-devto.mjs
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
